{% block main %}
  <h2 id="destinationHeading">Waiting for route</h2>
  <ol id="nav-steps" style="text-align: left"></ol>
  <script>
  (() => {
    const heading = document.getElementById('destinationHeading');
    const steps = document.getElementById('nav-steps');
    let route;
    async function refresh() {
      try {
        const current = await fetch('/CurrentStep.json', {cache: 'no-store'});
        if (!current.ok) throw new Error();
        const step = await current.json();
        if (!route || step.uuid !== route.uuid) {
          const response = await fetch('/navdirections.json', {cache: 'no-store'});
          if (!response.ok) throw new Error();
          route = await response.json();
        }
        if (step.uuid !== route.uuid) throw new Error();
        const first = route.routes[0];
        heading.textContent = first.Destination;
        steps.replaceChildren();
        for (const item of first.legs[0].steps.slice(step.CurrentStep)) {
          const row = document.createElement('li');
          const distance = first.Metric ? item.distance / 1000 : item.distance / 1609.344;
          row.textContent = item.maneuver.instruction + ' · ' + distance.toFixed(1) + (first.Metric ? ' km' : ' mi');
          steps.append(row);
        }
      } catch {
        heading.textContent = 'Waiting for route';
        steps.replaceChildren();
        route = null;
      } finally {
        setTimeout(refresh, 5000);
      }
    }
    refresh();
  })();
  </script>
{% endblock %}
